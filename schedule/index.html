<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>日程 · Keyue Xing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking: Google Fonts is often unreachable from mainland China. -->
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,620&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --ink: #1c3140;
      --muted: #4d6573;
      --faint: #8aa2ae;
      --line: #c5d8e2;
      --sky: #e5f2f7;
      --paper: #f3f9fb;
      --link: #1a4f68;
      --warn: #b3492f;
      --due: #c4573a;
      --serif: Fraunces, "Songti SC", "Noto Serif SC", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--sky);
      font-family: "Familjen Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 450;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .wrap {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding-bottom: 72px;
    }

    header.top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px 24px;
      flex-wrap: wrap;
      padding: 28px 0 0;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 620;
      font-size: 36px;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .toc {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 14px;
      font-weight: 600;
    }
    .toc a { color: var(--muted); text-decoration: none; }
    .toc a:hover { color: var(--ink); }
    .sync {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-weight: 500;
    }
    .sync::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }
    .sync[data-state="synced"]::before { background: #3d7a5a; }
    .sync[data-state="saving"]::before,
    .sync[data-state="loading"]::before { background: #c28f2c; }
    .sync[data-state="error"]::before,
    .sync[data-state="offline"]::before { background: var(--warn); }
    .linkbtn {
      background: none;
      border: 0;
      padding: 0 0 1px;
      font-weight: 600;
      color: var(--link);
      border-bottom: 1px solid rgba(26, 79, 104, 0.35);
    }
    .linkbtn:hover { border-bottom-color: var(--link); }
    .banner {
      margin: 18px 0 0;
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--paper);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      font-size: 15px;
    }
    .banner.is-warn { border-color: rgba(179, 73, 47, 0.4); }
    .banner p { margin: 0; flex: 1 1 280px; }

    .label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    /* next three days */
    .next {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 36px;
      margin: 28px 0 0;
    }
    .next .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .next .planned { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .next .date {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-weight: 560;
      font-size: 22px;
      line-height: 1.25;
    }
    .bar {
      display: flex;
      height: 5px;
      margin: 0 0 8px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(28, 49, 64, 0.08);
    }
    .bar span { background: var(--c); }
    .bar span + span { box-shadow: inset 1px 0 0 var(--sky); }
    ul.evs { margin: 0; padding: 0; list-style: none; }
    ul.evs li { border-top: 1px solid var(--line); }
    ul.evs li:last-child { border-bottom: 1px solid var(--line); }
    li.empty { padding: 8px 0; color: var(--faint); font-size: 15px; }
    .ev-btn {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 10px;
      width: 100%;
      padding: 8px 4px 8px 13px;
      border: 0;
      background: none;
      text-align: left;
    }
    .ev-btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 2px;
      background: var(--c);
    }
    .ev-btn:hover { background: rgba(255, 255, 255, 0.45); }
    .ev .time {
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      padding-top: 1px;
      white-space: nowrap;
    }
    .ev .title { font-weight: 500; overflow-wrap: anywhere; }
    .ev .note {
      grid-column: 2;
      color: var(--muted);
      font-size: 14px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0 0; }
    .nudge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--c);
    }
    .nudge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
    .add {
      margin-left: auto;
      padding: 0;
      border: 0;
      background: none;
      color: var(--link);
      font-size: 14px;
      font-weight: 600;
    }
    .add:hover { text-decoration: underline; }

    /* deadlines */
    .due {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin: 26px 0 0;
    }
    .due .label { color: var(--due); margin-right: 4px; }
    .due-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 12px;
      border: 1px solid rgba(196, 87, 58, 0.35);
      border-radius: 999px;
      background: var(--paper);
      font-size: 14.5px;
    }
    .due-chip:hover { border-color: var(--due); }
    .due-chip .count { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .due-chip .count.soon { color: var(--due); }
    .due-chip .title { font-weight: 600; }
    .due-chip .when { font-size: 13px; color: var(--muted); }
    .due-chip .prep {
      padding: 0 6px;
      border-radius: 3px;
      background: rgba(196, 87, 58, 0.12);
      color: var(--due);
      font-size: 12.5px;
      font-weight: 600;
    }

    /* month */
    .cal { margin: 40px 0 0; }
    .cal-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 20px;
      margin: 0 0 12px;
    }
    h2 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 560;
      font-size: 28px;
      line-height: 1.2;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; cursor: help; }
    .legend span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
    .cal-nav { display: flex; gap: 6px; margin-left: auto; }
    .cal-nav button {
      min-width: 34px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--paper);
      font-size: 14px;
      font-weight: 600;
    }
    .cal-nav button:hover { border-color: var(--muted); }
    .dow {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .dow span { padding: 0 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }
    .cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      min-height: 128px;
      padding: 6px 6px 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .cell:hover { background: rgba(255, 255, 255, 0.35); }
    .cell.is-today { background: rgba(255, 255, 255, 0.55); }
    .cell.is-out { color: var(--faint); }
    .cell.is-out .chip { opacity: 0.55; }
    .cell-head { display: flex; align-items: center; justify-content: space-between; }
    .num {
      display: inline-block;
      min-width: 24px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .cell.is-today .num { background: var(--ink); color: var(--sky); }
    .cell-add {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: var(--muted);
      font-size: 17px;
      line-height: 1;
      opacity: 0;
    }
    .cell:hover .cell-add, .cell-add:focus-visible { opacity: 1; }
    .cell-add:hover { background: rgba(28, 49, 64, 0.08); }
    .chips { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .chip {
      display: block;
      width: 100%;
      overflow: hidden;
      padding: 2px 6px;
      border: 0;
      border-left: 3px solid var(--c);
      border-radius: 2px;
      background: color-mix(in srgb, var(--c) 13%, transparent);
      font-size: 13px;
      line-height: 1.4;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .chip:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
    .chip b { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
    .more {
      align-self: flex-start;
      padding: 0 6px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
    }
    .more:hover { color: var(--ink); }

    .btn {
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      color: var(--sky);
      font-size: 14.5px;
      font-weight: 600;
    }
    .btn:hover { background: #2a4558; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.ghost:hover { border-color: var(--muted); }
    .btn.danger { background: transparent; color: var(--warn); border-color: rgba(179, 73, 47, 0.4); }
    .btn.danger:hover { border-color: var(--warn); }
    .btn:disabled { opacity: 0.6; cursor: default; }

    dialog {
      width: min(460px, calc(100% - 32px));
      padding: 22px 22px 18px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 18px 50px rgba(28, 49, 64, 0.22);
    }
    dialog::backdrop { background: rgba(28, 49, 64, 0.28); }
    dialog h3 {
      margin: 0 0 16px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 22px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; min-width: 0; }
    .field > span, legend {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
    }
    .field textarea { resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid rgba(26, 79, 104, 0.35);
      outline-offset: 0;
      border-color: var(--link);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .hint { margin: -4px 0 12px; font-size: 13px; color: var(--muted); }
    fieldset { margin: 0 0 12px; padding: 0; border: 0; }
    legend { padding: 0; margin-bottom: 6px; }
    .picks { display: flex; flex-wrap: wrap; gap: 6px; }
    .pick { position: relative; }
    .pick input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .pick span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 14px;
    }
    .pick span::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--c);
    }
    .pick input:checked + span { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); font-weight: 600; }
    .pick input:focus-visible + span { outline: 2px solid var(--link); outline-offset: 2px; }
    .kind-rule { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .actions .spacer { flex: 1; }
    .steps { margin: 0 0 14px; padding-left: 20px; font-size: 14.5px; }
    .steps li { margin: 0 0 6px; }
    .steps a { color: var(--link); font-weight: 600; }
    code { font-size: 0.92em; background: rgba(197, 216, 226, 0.5); padding: 1px 4px; border-radius: 2px; }
    .msg { margin: 0 0 12px; color: var(--warn); font-size: 14.5px; }
    #dayList { margin: 0 0 14px; }

    @media (max-width: 860px) {
      .wrap { width: calc(100% - 32px); }
      .next { grid-template-columns: 1fr; gap: 22px; }
      .cell { min-height: 96px; }
    }
    @media (max-width: 560px) {
      h1 { font-size: 30px; }
      .cell { min-height: 58px; padding: 4px; }
      .dow span { padding: 0 5px; }
      .chips { flex-direction: row; flex-wrap: wrap; gap: 3px; padding-left: 4px; }
      .chip { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: var(--c); font-size: 0; pointer-events: none; }
      .cell-add, .more { display: none; }
      .row { grid-template-columns: 1fr; }
      .cal-nav { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>日程</h1>
      <nav class="toc">
        <a href="../about.html">关于</a>
        <span class="sync" id="sync" data-state="setup">未连接</span>
        <button type="button" class="linkbtn" id="settingsBtn">GitHub</button>
      </nav>
    </header>
    <div class="banner" id="setupBanner" hidden>
      <p>连接 GitHub 后才能保存日程。</p>
      <button type="button" class="btn" id="connectBtn">连接 GitHub</button>
    </div>
    <div class="banner is-warn" id="notice" hidden>
      <p id="noticeText"></p>
      <button type="button" class="btn ghost" id="noticeClose">知道了</button>
    </div>

    <section class="next" id="next" aria-label="今天、明天、后天"></section>

    <section class="due" id="due" aria-label="即将截止" hidden>
      <p class="label">截止</p>
    </section>

    <section class="cal" aria-label="月历">
      <div class="cal-head">
        <h2 id="monthTitle"></h2>
        <div class="legend" id="legend"></div>
        <div class="cal-nav">
          <button type="button" id="prevMonth" aria-label="上个月">‹</button>
          <button type="button" id="thisMonth">今天</button>
          <button type="button" id="nextMonth" aria-label="下个月">›</button>
        </div>
      </div>
      <div class="dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <dialog id="dayDialog">
    <h3 id="dayTitle"></h3>
    <div id="dayList"></div>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="dayClose">关闭</button>
      <button type="button" class="btn" id="dayAdd">+ 添加</button>
    </div>
  </dialog>

  <dialog id="editor">
    <form id="editorForm" novalidate>
      <h3 id="editorTitle">新建日程</h3>
      <label class="field"><span>标题</span><input name="title" required autocomplete="off"></label>
      <fieldset>
        <legend>类型</legend>
        <div class="picks" id="kindPick"></div>
        <p class="kind-rule" id="kindRule"></p>
      </fieldset>
      <div class="row">
        <label class="field"><span id="dateLabel">日期</span><input type="date" name="date" required></label>
        <label class="field"><span>重复</span>
          <select name="repeat">
            <option value="">不重复</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="biweekly">每两周</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label class="field"><span>开始</span><input type="time" name="start"></label>
        <label class="field"><span>结束</span><input type="time" name="end"></label>
      </div>
      <p class="hint">不填时间 = 全天</p>
      <label class="field" id="untilField"><span>重复到（可不填）</span><input type="date" name="until"></label>
      <label class="field"><span>备注</span><textarea name="note" rows="2"></textarea></label>
      <p class="hint" id="seriesHint">改动会应用到每一次重复</p>
      <p class="msg" id="editorMsg" hidden></p>
      <div class="actions">
        <button type="button" class="btn danger" id="deleteOne">只删这天</button>
        <button type="button" class="btn danger" id="deleteAll">删除</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="editorCancel">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings">
    <form id="settingsForm" novalidate>
      <h3>连接 GitHub</h3>
      <ol class="steps">
        <li><a href="https://github.com/new" target="_blank" rel="noopener">新建私有仓库</a> <code id="repoName"></code>，勾选 Add a README</li>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">生成令牌</a>：只选这个仓库，Contents 设为 Read and write</li>
        <li>粘贴到下面（只存在这个浏览器）</li>
      </ol>
      <p class="msg" id="settingsMsg" hidden></p>
      <label class="field"><span>令牌</span><input type="password" name="token" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <div class="actions">
        <button type="button" class="btn danger" id="disconnect">断开</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="settingsCancel">取消</button>
        <button type="submit" class="btn" id="settingsSave">连接</button>
      </div>
    </form>
  </dialog>

  <script>
  (() => {
    'use strict';

    // Where the events live. Point this at a public repo instead if the schedule should be public.
    const STORE = { owner: 'Alita-xky', repo: 'schedule', branch: 'main', path: 'events.json' };
    const API = `https://api.github.com/repos/${STORE.owner}/${STORE.repo}`;

    // Each event has one kind; the kind decides its color and the short rule shown for it.
    const KINDS = {
      fixed: { name: '固定', color: '#1c3140', what: '上课、组会', rule: '先放进日历，别的绕着它排' },
      deep: { name: '深度', color: '#2f7ea8', what: '科研、写代码、备考', rule: '60–90 分钟一块，一天最多 3 块' },
      due: { name: '截止', color: '#c4573a', what: 'ddl、考试', rule: '往前倒推，提前放深度块' },
      admin: { name: '杂事', color: '#c28f2c', what: '邮件、报销', rule: '攒在一起，30 分钟清掉' },
      life: { name: '生活', color: '#3d7a5a', what: '运动、吃饭、睡觉', rule: '和上课一样认真' },
      free: { name: '留白', color: '#9384c4', what: '空档', rule: '每天留 1–2 小时，计划乱了用它补' },
    };
    const LEGACY_COLORS = { ink: 'fixed', blue: 'deep', coral: 'due', amber: 'admin', green: 'life', violet: 'free' };
    const NEXT_LABELS = ['今天', '明天', '后天'];
    const WEEK = '日一二三四五六';
    const DAY_HOURS = 16;   // a waking day, roughly 7:00–23:00
    const CHIPS_PER_CELL = 4;

    const $ = sel => document.querySelector(sel);
    const store = {
      get: k => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      del: k => { try { localStorage.removeItem(k); } catch {} },
    };
    const clone = x => JSON.parse(JSON.stringify(x));
    const narrow = () => matchMedia('(max-width: 560px)').matches;

    // ---- dates: every day is a local "YYYY-MM-DD" key

    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
    const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
    const md = k => { const d = dateOf(k); return `${d.getMonth() + 1}月${d.getDate()}日`; };
    const wk = k => '周' + WEEK[dateOf(k).getDay()];

    function occursOn(ev, k) {
      if (k < ev.date || (ev.until && k > ev.until)) return false;
      if (ev.skip && ev.skip.includes(k)) return false;
      const diff = dayNum(k) - dayNum(ev.date);
      if (ev.repeat === 'daily') return true;
      if (ev.repeat === 'weekly') return diff % (7 * (ev.every || 1)) === 0;
      return diff === 0;
    }
    const byTime = (a, b) => (a.start || '').localeCompare(b.start || '') || a.title.localeCompare(b.title);
    const eventsOn = k => state.data.events.filter(ev => occursOn(ev, k)).sort(byTime);
    const timeText = ev => ev.start ? (ev.end ? `${ev.start}–${ev.end}` : ev.start) : '全天';
    const kindOf = ev => KINDS[ev.kind] ? ev.kind : 'fixed';
    const colorOf = ev => KINDS[kindOf(ev)].color;

    function normalize(d) {
      const events = (Array.isArray(d && d.events) ? d.events : [])
        .filter(e => e && e.id && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
      for (const e of events) {   // events saved before kinds existed only had a color
        if (!e.kind && e.color) e.kind = LEGACY_COLORS[e.color] || 'fixed';
        delete e.color;
      }
      return { version: 1, events };
    }

    // ---- planning helpers

    const minutes = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    const hours = h => `${Math.round(h * 2) / 2}h`;

    function dayStats(evs) {
      const by = {};
      let total = 0;
      for (const ev of evs) {
        if (!ev.start || !ev.end) continue;
        const h = (minutes(ev.end) - minutes(ev.start)) / 60;
        if (h <= 0) continue;
        by[kindOf(ev)] = (by[kindOf(ev)] || 0) + h;
        total += h;
      }
      return { by, total };
    }

    // At most one short reminder per day.
    function nudge(evs, stats) {
      if (!evs.length) return null;
      const has = kind => evs.some(ev => kindOf(ev) === kind);
      if (stats.total > DAY_HOURS * 0.7) return { kind: 'due', text: '排太满了' };
      if (!has('deep') && !has('due')) return { kind: 'deep', text: '没有深度块' };
      if (!has('free') && stats.total >= 6) return { kind: 'free', text: '加块留白' };
      return null;
    }

    function upcomingDue(days) {
      const out = [];
      for (let i = 0; i <= days; i++) {
        const k = addDays(state.today, i);
        for (const ev of eventsOn(k)) {
          if (kindOf(ev) !== 'due') continue;
          let prepared = false;   // any deep block between now and the deadline?
          for (let j = 0; j < i && !prepared; j++) prepared = eventsOn(addDays(state.today, j)).some(e => kindOf(e) === 'deep');
          out.push({ ev, k, i, prepared });
        }
      }
      return out.slice(0, 6);
    }

    // ---- state

    const today = keyOf(new Date());
    const state = {
      token: store.get('schedule.token') || '',
      data: readCache(),
      remote: null,   // last copy known to be on GitHub
      sha: null,
      rev: 0,         // bumps on every local change
      pending: 0,     // changes not yet on GitHub
      today,
      month: today.slice(0, 7),
    };

    function readCache() {
      try { return normalize(JSON.parse(store.get('schedule.cache'))); } catch { return normalize(null); }
    }
    const writeCache = () => store.set('schedule.cache', JSON.stringify(state.data));

    // ---- GitHub contents API

    class SyncError extends Error {
      constructor(kind, status) { super(kind); this.kind = kind; this.status = status; }
    }
    const errorKind = status => status === 401 || status === 403 ? 'auth' : 'http';

    async function gh(path, opts = {}) {
      try {
        return await fetch(API + path, {
          cache: 'no-store',
          ...opts,
          headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${state.token}`, ...opts.headers },
        });
      } catch {
        throw new SyncError('net');
      }
    }

    function toB64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    }
    const fromB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));

    async function getRemote() {
      const res = await gh(`/contents/${STORE.path}?ref=${STORE.branch}&t=${Date.now()}`);
      if (res.status === 404) {
        // Either the repo is invisible to this token, or events.json just doesn't exist yet.
        const repo = await gh('');
        if (!repo.ok) throw new SyncError(repo.status === 404 ? 'repo' : errorKind(repo.status), repo.status);
        return { data: normalize(null), sha: null };
      }
      if (!res.ok) throw new SyncError(errorKind(res.status), res.status);
      const file = await res.json();
      return { data: normalize(JSON.parse(fromB64(file.content))), sha: file.sha };
    }

    function putRemote(data, sha, message) {
      const body = { message, branch: STORE.branch, content: toB64(JSON.stringify(data, null, 2) + '\n') };
      if (sha) body.sha = sha;
      return gh(`/contents/${STORE.path}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    // ---- sync

    let queue = Promise.resolve();

    function adopt(remote) {
      state.remote = remote.data;
      state.sha = remote.sha;
      state.data = clone(remote.data);
      writeCache();
      render();
    }

    async function refresh() {
      if (!state.token || state.pending) return;
      const rev = state.rev;
      setStatus('loading');
      try {
        const remote = await getRemote();
        if (state.rev !== rev || state.pending) return;
        adopt(remote);
        setStatus('synced');
      } catch (err) {
        if (state.rev === rev && !state.pending) failed(err, false);
      }
    }

    // Apply `mutate` here right away, then replay it on top of GitHub's latest copy.
    // Mutations work by event id, so replaying after a conflict is safe.
    function change(mutate, message) {
      mutate(state.data);
      state.rev++;
      state.pending++;
      writeCache();
      render();
      setStatus('saving');
      queue = queue.then(async () => {
        try {
          await push(mutate, message);
          state.pending--;
          if (!state.pending) { state.data = clone(state.remote); writeCache(); render(); setStatus('synced'); hideNotice(); }
        } catch (err) {
          state.pending--;
          failed(err, true);
        }
      });
    }

    async function push(mutate, message) {
      let base = state.remote ? { data: state.remote, sha: state.sha } : await getRemote();
      for (let attempt = 0; attempt < 3; attempt++) {
        const next = clone(base.data);
        mutate(next);
        const res = await putRemote(next, base.sha, message);
        if (res.ok) {
          state.remote = next;
          state.sha = (await res.json()).content.sha;
          return;
        }
        if (res.status !== 409 && res.status !== 422) throw new SyncError(errorKind(res.status), res.status);
        base = await getRemote();   // someone else saved first: rebase and retry
      }
      throw new SyncError('conflict');
    }

    function failed(err, wasSaving) {
      if (wasSaving && state.remote && !state.pending) {
        state.data = clone(state.remote);
        writeCache();
        render();
      }
      if (err.kind === 'net') {
        setStatus('offline', wasSaving ? '未保存' : '离线');
        showNotice(wasSaving ? '连不上 GitHub，刚才的修改没保存。' : '连不上 GitHub，显示的是本地副本。');
      } else {
        setStatus('error', wasSaving ? '未保存' : '同步出错');
        if (err.kind === 'auth' || err.kind === 'repo') openSettings(errorText(err));
        else showNotice(errorText(err));
      }
    }

    function errorText(err) {
      if (err.kind === 'auth') {
        return err.status === 403
          ? `令牌没有 ${STORE.owner}/${STORE.repo} 的 Contents 读写权限。`
          : '令牌无效或已过期。';
      }
      if (err.kind === 'repo') return `令牌看不到 ${STORE.owner}/${STORE.repo}。`;
      if (err.kind === 'net') return '连不上 GitHub。';
      if (err.kind === 'conflict') return '其他设备同时在保存，刷新后再试。';
      return `GitHub 出错${err.status ? `（${err.status}）` : ''}，稍后再试。`;
    }

    function setStatus(s, text) {
      const el = $('#sync');
      el.dataset.state = s;
      el.textContent = text || { synced: '已同步', saving: '保存中…', loading: '加载中…', setup: '未连接', error: '同步出错', offline: '离线' }[s];
    }
    function showNotice(text) { $('#noticeText').textContent = text; $('#notice').hidden = false; }
    function hideNotice() { $('#notice').hidden = true; }

    // ---- mutations

    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const upsert = ev => d => { d.events = d.events.filter(e => e.id !== ev.id); d.events.push(clone(ev)); };
    const remove = id => d => { d.events = d.events.filter(e => e.id !== id); };
    const skipDay = (id, k) => d => {
      const ev = d.events.find(e => e.id === id);
      if (ev && !(ev.skip || []).includes(k)) ev.skip = [...(ev.skip || []), k].sort();
    };

    // ---- rendering

    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style') el.style.cssText = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
      for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
      return el;
    }

    const kindTip = key => `${KINDS[key].name}：${KINDS[key].what} · ${KINDS[key].rule}`;

    function eventList(k, evs) {
      if (!evs.length) return h('ul', { class: 'evs' }, h('li', { class: 'empty' }, '没有安排'));
      return h('ul', { class: 'evs' }, evs.map(ev =>
        h('li', { class: 'ev' },
          h('button', { type: 'button', class: 'ev-btn', style: `--c:${colorOf(ev)}`, title: KINDS[kindOf(ev)].name, onclick: () => openEditor(ev, k) },
            h('span', { class: 'time' }, timeText(ev)),
            h('span', { class: 'title' }, ev.title),
            ev.note ? h('span', { class: 'note' }, ev.note) : null))));
    }

    function bar(stats) {
      const scale = Math.max(DAY_HOURS, stats.total);
      const parts = Object.keys(KINDS).filter(k => stats.by[k]);
      return h('div', { class: 'bar', role: 'img', 'aria-label': parts.map(k => `${KINDS[k].name} ${hours(stats.by[k])}`).join('，') },
        parts.map(k => h('span', { style: `--c:${KINDS[k].color};width:${stats.by[k] / scale * 100}%`, title: `${KINDS[k].name} ${hours(stats.by[k])}` })));
    }

    function renderNext() {
      $('#next').replaceChildren(...NEXT_LABELS.map((label, i) => {
        const k = addDays(state.today, i);
        const evs = eventsOn(k);
        const stats = dayStats(evs);
        const n = nudge(evs, stats);
        return h('div', null,
          h('div', { class: 'head' },
            h('p', { class: 'label' }, label),
            stats.total ? h('span', { class: 'planned' }, `已排 ${hours(stats.total)}`) : null),
          h('p', { class: 'date' }, `${md(k)} ${wk(k)}`),
          bar(stats),
          eventList(k, evs),
          h('div', { class: 'foot' },
            n ? h('span', { class: 'nudge', style: `--c:${KINDS[n.kind].color}` }, n.text) : null,
            h('button', { type: 'button', class: 'add', onclick: () => openEditor(null, k) }, '+ 添加')));
      }));
    }

    function renderDue() {
      const items = upcomingDue(30);
      const section = $('#due');
      section.hidden = !items.length;
      section.replaceChildren(section.firstElementChild, ...items.map(({ ev, k, i, prepared }) =>
        h('button', { type: 'button', class: 'due-chip', onclick: () => openEditor(ev, k) },
          h('span', { class: 'count' + (i <= 3 ? ' soon' : '') }, i === 0 ? '今天' : i === 1 ? '明天' : `${i}天`),
          h('span', { class: 'title' }, ev.title),
          h('span', { class: 'when' }, md(k)),
          !prepared && i >= 2 ? h('span', { class: 'prep', title: '截止前还没有深度块' }, '未准备') : null)));
    }

    function renderMonth() {
      const [y, m] = state.month.split('-').map(Number);
      $('#monthTitle').textContent = `${y}年${m}月`;
      const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;   // weeks start on Monday
      const cells = Math.ceil((offset + new Date(y, m, 0).getDate()) / 7) * 7;
      const start = keyOf(new Date(y, m - 1, 1 - offset));
      const out = [];
      for (let i = 0; i < cells; i++) {
        const k = addDays(start, i);
        const evs = eventsOn(k);
        const cls = ['cell', k.slice(0, 7) !== state.month && 'is-out', k === state.today && 'is-today'];
        const extra = evs.length - CHIPS_PER_CELL;
        out.push(h('div', {
          class: cls.filter(Boolean).join(' '),
          'data-k': k,
          onclick: e => { if (!e.target.closest('button')) narrow() ? openDay(k) : openEditor(null, k); },
        },
          h('div', { class: 'cell-head' },
            h('span', { class: 'num' }, String(dateOf(k).getDate())),
            h('button', { type: 'button', class: 'cell-add', 'aria-label': `在${md(k)}添加`, onclick: () => openEditor(null, k) }, '+')),
          h('div', { class: 'chips' },
            evs.slice(0, extra > 0 ? CHIPS_PER_CELL - 1 : CHIPS_PER_CELL).map(ev =>
              h('button', { type: 'button', class: 'chip', style: `--c:${colorOf(ev)}`, title: `${timeText(ev)} ${ev.title}`, onclick: () => openEditor(ev, k) },
                ev.start ? h('b', null, ev.start) : null, ev.title)),
            extra > 0 ? h('button', { type: 'button', class: 'more', onclick: () => openDay(k) }, `还有 ${extra + 1} 项`) : null)));
      }
      $('#grid').replaceChildren(...out);
    }

    function render() {
      $('#setupBanner').hidden = !!state.token;
      renderNext();
      renderDue();
      renderMonth();
    }

    function shiftMonth(n) {
      const [y, m] = state.month.split('-').map(Number);
      state.month = keyOf(new Date(y, m - 1 + n, 1)).slice(0, 7);
      renderMonth();
    }

    $('#legend').append(...Object.keys(KINDS).map(key =>
      h('span', { style: `--c:${KINDS[key].color}`, title: kindTip(key) }, KINDS[key].name)));

    // ---- one day (used on phones and for busy days)

    const dayDialog = $('#dayDialog');
    let dayKey = null;

    function openDay(k) {
      dayKey = k;
      $('#dayTitle').textContent = `${md(k)} ${wk(k)}`;
      $('#dayList').replaceChildren(eventList(k, eventsOn(k)));
      dayDialog.showModal();
    }
    $('#dayClose').addEventListener('click', () => dayDialog.close());
    $('#dayAdd').addEventListener('click', () => openEditor(null, dayKey));

    // ---- event editor

    const editor = $('#editor');
    const E = $('#editorForm').elements;
    let editing = null;   // { ev, k }: ev is null for a new event; k is the day it was opened from

    $('#kindPick').append(...Object.entries(KINDS).map(([key, k]) =>
      h('label', { class: 'pick', style: `--c:${k.color}` },
        h('input', { type: 'radio', name: 'kind', value: key }),
        h('span', null, k.name))));

    function showKindRule() {
      const k = KINDS[E.kind.value] || KINDS.fixed;
      $('#kindRule').textContent = `${k.what} · ${k.rule}`;
    }
    $('#kindPick').addEventListener('change', showKindRule);

    function openEditor(ev, k) {
      if (dayDialog.open) dayDialog.close();
      if (!state.token) { openSettings('先连接 GitHub 才能保存。'); return; }
      editing = { ev, k };
      $('#editorForm').reset();
      $('#editorTitle').textContent = ev ? '编辑日程' : `新建 · ${md(k)}`;
      E.title.value = ev ? ev.title : '';
      E.kind.value = ev ? kindOf(ev) : 'fixed';
      E.date.value = ev ? ev.date : k;
      E.start.value = (ev && ev.start) || '';
      E.end.value = (ev && ev.end) || '';
      E.repeat.value = !ev || !ev.repeat ? '' : ev.repeat === 'weekly' && ev.every === 2 ? 'biweekly' : ev.repeat;
      E.until.value = (ev && ev.until) || '';
      E.note.value = (ev && ev.note) || '';
      $('#deleteOne').hidden = !(ev && ev.repeat);
      $('#deleteAll').hidden = !ev;
      $('#deleteAll').textContent = ev && ev.repeat ? '全部删除' : '删除';
      $('#seriesHint').hidden = !(ev && ev.repeat);
      $('#editorMsg').hidden = true;
      showKindRule();
      syncRepeatFields();
      editor.showModal();
      E.title.focus();
    }

    function syncRepeatFields() {
      $('#untilField').hidden = !E.repeat.value;
      $('#dateLabel').textContent = E.repeat.value ? '从哪天开始' : '日期';
    }
    E.repeat.addEventListener('change', syncRepeatFields);

    function editorError(text) {
      $('#editorMsg').textContent = text;
      $('#editorMsg').hidden = false;
    }

    $('#editorForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = E.title.value.trim();
      const date = E.date.value;
      const start = E.start.value;
      const end = start ? E.end.value : '';
      const repeat = E.repeat.value;
      const until = repeat ? E.until.value : '';
      if (!title) return editorError('请填写标题。');
      if (!date) return editorError('请选择日期。');
      if (end && end < start) return editorError('结束时间早于开始时间。');
      if (until && until < date) return editorError('“重复到”早于开始日期。');

      const prev = editing.ev;
      const ev = { id: prev ? prev.id : newId(), title, date, kind: E.kind.value || 'fixed' };
      if (start) ev.start = start;
      if (end) ev.end = end;
      if (repeat) {
        ev.repeat = repeat === 'biweekly' ? 'weekly' : repeat;
        if (repeat === 'biweekly') ev.every = 2;
        if (until) ev.until = until;
        if (prev && prev.skip && prev.skip.length) ev.skip = prev.skip.slice();
      }
      const note = E.note.value.trim();
      if (note) ev.note = note;

      editor.close();
      change(upsert(ev), `${prev ? '修改' : '添加'}「${title}」(${date})`);
      if (date.slice(0, 7) !== state.month && !repeat) { state.month = date.slice(0, 7); renderMonth(); }
    });

    $('#deleteAll').addEventListener('click', () => {
      const { ev } = editing;
      editor.close();
      change(remove(ev.id), `删除「${ev.title}」`);
    });
    $('#deleteOne').addEventListener('click', () => {
      const { ev, k } = editing;
      editor.close();
      change(skipDay(ev.id, k), `跳过「${ev.title}」${k}`);
    });
    $('#editorCancel').addEventListener('click', () => editor.close());

    // ---- token settings

    const settings = $('#settings');
    const T = $('#settingsForm').elements;
    $('#repoName').textContent = STORE.repo;

    function openSettings(msg) {
      if (editor.open) editor.close();
      $('#settingsMsg').textContent = msg || '';
      $('#settingsMsg').hidden = !msg;
      T.token.value = state.token;
      $('#disconnect').hidden = !state.token;
      if (!settings.open) settings.showModal();
      T.token.focus();
    }

    $('#settingsForm').addEventListener('submit', async e => {
      e.preventDefault();
      const token = T.token.value.trim();
      if (!token) return;
      const prev = state.token;
      const btn = $('#settingsSave');
      btn.disabled = true;
      btn.textContent = '检查中…';
      state.token = token;
      try {
        const remote = await getRemote();
        store.set('schedule.token', token);
        settings.close();
        hideNotice();
        adopt(remote);
        setStatus('synced');
      } catch (err) {
        state.token = prev;
        $('#settingsMsg').textContent = errorText(err);
        $('#settingsMsg').hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = '连接';
      }
    });

    $('#disconnect').addEventListener('click', () => {
      state.token = '';
      state.remote = state.sha = null;
      state.data = normalize(null);
      store.del('schedule.token');
      store.del('schedule.cache');
      settings.close();
      hideNotice();
      setStatus('setup');
      render();
    });
    $('#settingsCancel').addEventListener('click', () => settings.close());
    $('#settingsBtn').addEventListener('click', () => openSettings());
    $('#connectBtn').addEventListener('click', () => openSettings());
    $('#noticeClose').addEventListener('click', hideNotice);

    $('#prevMonth').addEventListener('click', () => shiftMonth(-1));
    $('#nextMonth').addEventListener('click', () => shiftMonth(1));
    $('#thisMonth').addEventListener('click', () => { state.month = state.today.slice(0, 7); renderMonth(); });

    // Roll over at midnight, and pick up edits made on other devices when the tab comes back.
    function tick() {
      const now = keyOf(new Date());
      if (now === state.today) return;
      if (state.month === state.today.slice(0, 7)) state.month = now.slice(0, 7);
      state.today = now;
      render();
    }
    setInterval(tick, 60 * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      tick();
      refresh();
    });

    render();
    if (state.token) refresh();
    else setStatus('setup');
  })();
  </script>
</body>
</html>
