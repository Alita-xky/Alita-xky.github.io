const DATA = {"basket": {"story": "[Shot 1]\n\n[00–07s] Cora, in a coral sports top and navy trousers, stands beside the white court sideline. An empty plastic basket sits just outside her feet, its low rim beside the crossing path of her shoes. Folded bleachers line the wall. Camera: From the outer edge of the practice court, the camera begins a small, slow sideways drift. The oblique wide view includes Cora, the white court sideline, empty basket and folded bleachers and the floor around the object.\n\n[07–15s] Cora performs @ref[B31.mp4], moving into the side lunge and returning upright. She adjusts her feet near the basket, lowers her center and brings her hands into a ready position. Camera: The drift gradually settles into a steady full-body view. Cora and the nearby object share the frame.\n\n[15–24s] She performs @ref[A07.mp4]. As her feet cross, the moving shoe brushes the basket near its lower rim. The basket tips onto one side and skids across the painted sideline, slowing to a stop while Cora finishes the punch. Camera: The camera rests in the same wide view, showing Cora, the contact and the object moving across the visible surface.\n\n[24–32s] Cora moves into the clear court, brings her feet together and performs @ref[C15.mp4]. She straightens and lowers her arms. The white basket remains beyond the sideline with its open mouth facing the bleachers. Camera: The steady oblique view includes Cora from head to foot and the object in its new resting place.\n\n[32–40s] She walks along the sideline and stops opposite the basket. Cora looks down at where it has come to rest, folds her arms loosely and leans back against the closed bleachers. Camera: The camera remains at rest as Cora moves within the wide view. The object and the surrounding floor remain visible.\n", "refs": [{"id": "B31", "span": [7, 15], "caption": "Cora steps sideways, bends one knee into a side lunge while the other leg extends and pushes back to standing."}, {"id": "A07", "span": [15, 24], "caption": "Cora rises from a low crouch, turns the torso, crosses the legs and swings a fist outward in a whipping punch."}, {"id": "C15", "span": [24, 32], "caption": "Cora holds a chair pose with both knees bent, hips lowered and arms extended diagonally overhead."}], "prompts": [{"id": "w00", "start": 0.0, "end": 11.5, "text": "integrated_multimodal_description: The target video is live-action and photorealistic, an indoor practice court in a sports hall during the day under even, soft light from above, one continuous slightly elevated wide shot of about 11.5 seconds with no cuts. The pale wooden court floor is clear and empty. One straight white floor marking, the court sideline, runs across the floor. Behind it, across the centre of the background, stands one tall closed bank of folded bleachers, a flat-fronted box-shaped block pushed back against the hall wall; it is the only seating, and the wall around it is plain, with no door, opening, hoop, clock or sign. One bare, freestanding white plastic basket, an open-topped cylinder about knee-high, empty, with nothing in it, on it or attached to it, stands upright on the floor; it is the only basket and there is no second copy anywhere.\n[Shot 1] At first Cora, the athletic young woman with hair tied back, wearing a coral sports top, navy trousers and white trainers, stands on the near side of the white floor marking in the left third of the frame, her whole body in view. She faces away from us towards the folded bleachers, so we see her back and her left side in three-quarter view; she is upright, feet planted about hip-width apart, arms hanging at her sides, and she carries nothing. The cylinder-shaped white basket stands upright on the floor a short step in front of her and to her left, near the left edge of the frame; the floor marking runs through the middle of the frame to her right. Throughout the shot she moves exactly as the reference figure does: the same poses, facing, turns, steps and timing, frame by frame. The camera starts at the outer edge of the court in an oblique wide view aimed at the floor marking and makes a small, slow sideways drift while her feet stay fixed on the same spot of floor. From about 00:04.000 the drift swings the aim leftwards onto the basket, so that by 00:05.200 Cora is in the centre of the frame, with the basket just to her left at her feet and the floor marking further to her right; she stays planted and does not walk towards the basket. From 00:05.800 she is already moving into a side lunge, flowing straight out of her stance, and is in the lunge by 00:07.000; she then pushes back upright, adjusts her feet beside the basket and drops into a low ready stance, hands raised in front of her, through 00:11.540. During this whole movement we see her back and left side in three-quarter view, and her body keeps that orientation to us, never turned towards the camera. By about 00:08.000 the camera drift has come to rest on a steady full-body view, like a locked-off tripod: Cora in the centre, the upright basket just left of centre beside her feet, the floor marking in the right third, the folded bleachers across the centre of the background; all of them keep the same frame positions until the last frame. The basket stays upright and untouched throughout. She is the only person; no text or lettered signs appear.\n\noverall_soundscape: Quiet indoor sports hall: a faint hollow room echo, the low hum of the hall's ventilation, and the soft squeak and scuff of her white trainers on the wooden court floor as she moves; nobody speaks.\n\nnon_diegetic_music: None.\n"}, {"id": "w01", "start": 10.0, "end": 20.1, "text": "integrated_multimodal_description: The target video is live-action and photorealistic, an indoor practice court in a sports hall during the day under even, soft light from above, one continuous slightly elevated wide shot of about 10 seconds with no cuts. The pale wooden court floor is clear and empty. One straight white floor marking, the court sideline, runs across the floor in the right third of the frame. Behind it, across the centre of the background, stands one tall closed bank of folded bleachers, a flat-fronted box-shaped block pushed back against the hall wall; it is the only seating, and the wall around it is plain, with no door, opening, hoop, clock or sign. One bare, freestanding white plastic basket, an open-topped cylinder about knee-high, empty, with nothing in it, on it or attached to it, stands upright on the floor just left of centre; it is the only basket and there is no second copy anywhere.\n[Shot 1] At first Cora, the athletic young woman with hair tied back, wearing a coral sports top, navy trousers and white trainers, carrying nothing, is already in the middle of her side lunge in the centre of the frame, her whole body in view, the upright basket right beside her feet just to her left and the floor marking well to her right. She faces away from us towards the folded bleachers, so we see her back and her left side in three-quarter view, and her body keeps that orientation to us, never turned towards the camera. Throughout the shot she moves exactly as the reference figure does: the same poses, facing, turns, steps and timing, frame by frame. The camera rests in the same oblique wide view aimed at the basket, like a locked-off tripod, and does not move. At first she pushes back upright from the lunge, adjusts her feet beside the basket and drops into a low ready stance, hands raised in front of her, held through 00:05.000; she stays planted on the same spot and does not walk anywhere. From 00:05.000 she flows straight into a whipping punch: a dip, a torso twist, legs crossing, a fist whipping outwards. At about 00:05.250, in the middle of the movement, her left foot lightly brushes the lower rim of the basket; the basket tips over onto its side with a light hollow plastic clatter, skids about 1.6 m away to her left across the floor, slows and stops, lying on its side; from then on it lies there and nobody touches it again. She keeps moving through the punch without breaking off, her back and left side still towards us, and carries on with it until the last frame. From about 00:07.000 until the last frame the frame holds still: Cora in the centre, the one basket lying on its side on the bare floor about a third of the way in from the left edge, the floor marking in the right third, the folded bleachers across the centre of the background. She is the only person; no text or lettered signs appear.\n\noverall_soundscape: Quiet indoor sports hall: a faint hollow room echo, the low hum of the hall's ventilation, and the soft squeak and scuff of her white trainers on the wooden court floor as she moves; nobody speaks.\n\nnon_diegetic_music: None.\n"}, {"id": "w02", "start": 18.5, "end": 30.0, "text": "integrated_multimodal_description: The target video is live-action and photorealistic, an indoor practice court in a sports hall during the day under even, soft light from above, one continuous slightly elevated wide shot of about 11.5 seconds with no cuts. The pale wooden court floor is clear and empty. One straight white floor marking, the court sideline, runs across the floor. Behind it, across the centre of the background, stands one tall closed bank of folded bleachers, a flat-fronted box-shaped block pushed back against the hall wall; it is the only seating, and the wall around it is plain, with no door, opening, hoop, clock or sign. One bare white plastic basket, an open-topped cylinder about knee-high, empty, lies on its side on the floor where it came to rest, its open mouth facing the bleachers; it is the only basket and there is no second copy anywhere.\n[Shot 1] At first Cora, the athletic young woman with hair tied back, wearing a coral sports top, navy trousers and white trainers, carrying nothing, is finishing a whipping punch in the centre of the frame, her whole body in view, feet planted. She faces away from us towards the folded bleachers, so we see her back and her left side in three-quarter view, and her body keeps that orientation to us, never turned towards the camera. Throughout the shot she moves exactly as the reference figure does: the same poses, facing, turns, steps and timing, frame by frame. The camera opens aimed at the basket, which lies on its side on the bare floor to her left, about a third of the way in from the left edge, with the floor marking to her right. From 00:02.000 the camera pans steadily to the right towards the floor marking, aimed at it by 00:04.500, and keeps drifting a little further right until about 00:08.000, then holds still like a locked-off tripod until the last frame. As it pans, the lying basket moves towards the left edge of the frame and stays there, still on its side with its mouth towards the bleachers, untouched. She stays planted through the end of the punch until 00:05.500. From 00:05.620 she walks to the right across the floor marking into the clear court, her back and left side towards us, and stops at 00:08.250 in the right third of the frame, the floor marking now in the centre between her and the basket at the far left. At about 00:09.120 she turns on the spot as the reference figure does, never turned towards the camera, and from about 00:09.500 she holds a chair pose, feet together, arms extended overhead, until the last frame. From 00:08.000 until the last frame the frame holds: the one basket lying on its side at the left edge, the floor marking in the centre, Cora in the right third, the folded bleachers across the background. She is the only person; no text or lettered signs appear.\n\noverall_soundscape: Quiet indoor sports hall: a faint hollow room echo, the low hum of the hall's ventilation, and the soft squeak and scuff of her white trainers on the wooden court floor as she moves; nobody speaks.\n\nnon_diegetic_music: None.\n"}, {"id": "w03", "start": 28.5, "end": 40.0, "text": "integrated_multimodal_description: The tar const ORDER = ['smallbox', 'ball', 'picture', 'dough', 'garden', 'four', 'drawer', 'box', 'practice', 'stone', 'chair', 'cup', 'foam', 'balance', 'basket'];
const T = 40;
const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v); }
  for (const c of [].concat(kids)) if (c) e.append(c); return e; };
const pct = s => (100 * s / T).toFixed(3) + '%';
const fmt = s => s.toFixed(1) + ' 秒';
const idx = document.getElementById('index'), main = document.getElementById('main');

for (const key of ORDER) {
  const d = DATA[key], m = META[key];
  idx.append(el('a', { href: '#' + key }, [el('span', {}, [document.createTextNode(m.name), el('small', { text: m.kind })]),
    el('span', { class: 'pill ' + m.status[0], text: m.status[1] })]));
  const sec = el('section', { class: 'reel', id: key });
  sec.append(el('div', { class: 'rhead' }, [el('h2', { text: m.name }), el('span', { class: 'en', text: m.en }),
    el('span', { class: 'chip', text: m.kind + ' · ' + d.label }), el('span', { class: 'pill ' + m.status[0], text: m.status[1] })]));
  const vid = el('video', { class: 'take', src: 'takes/' + key + '.mp4', controls: '', preload: 'metadata', playsinline: '' });
  const left = el('div', {}, [vid, m.note ? el('p', { class: 'note', text: m.note }) : null]);
  const lists = el('div', { class: 'lists' }, [
    el('div', { class: 'good' }, [el('h3', { text: '做到了' }), el('ul', {}, m.good.map(t => el('li', { text: t })))]),
    el('div', { class: 'open' }, [el('h3', { text: '还有问题' }), el('ul', {}, m.open.map(t => el('li', { text: t })))])]);
  sec.append(el('div', { class: 'top2' }, [left, lists]));

  // timeline: actions, windows, seams, playhead
  const seek = s => { vid.currentTime = Math.max(0, s); vid.play().catch(() => {}); };
  const tl = el('div', { class: 'tl' });
  const rowA = el('div', { class: 'row' }), rowW = el('div', { class: 'row' });
  const same = {};                                   // two actions in one beat share its span: equal halves
  d.refs.forEach(r => { (same[r.span.join('-')] ||= []).push(r); });
  for (const r of d.refs) { const grp = same[r.span.join('-')], k = grp.indexOf(r), L = (r.span[1] - r.span[0]) / grp.length;
    const a = r.span[0] + k * L, b = a + L;
    const b_ = el('button', { class: 'seg act', style: `left:${pct(a)};width:calc(${pct(b - a)} - 2px)`, title: r.caption, 'aria-label': `${r.id} ${a}–${b} 秒`, text: r.id });
    b_.onclick = () => seek(a); rowA.append(b_); }
  d.prompts.forEach((p, i) => { const b_ = el('button', { class: 'seg win', style: `left:${pct(p.start)};width:calc(${pct(p.end - p.start)} - 2px);opacity:${i % 2 ? .75 : 1}`, title: `${p.id} ${p.start}–${p.end} 秒`, text: p.id });
    b_.onclick = () => seek(p.start); rowW.append(b_); });
  for (const s of d.seams) { const b_ = el('button', { class: 'seam', style: `left:${pct(s)}`, title: '接缝 ' + fmt(s), 'aria-label': '跳到接缝 ' + fmt(s) });
    b_.onclick = () => seek(s - 0.3); rowW.append(b_); }
  const ph = el('div', { class: 'play', style: 'left:0' }), ph2 = el('div', { class: 'play', style: 'left:0' });
  rowA.append(ph); rowW.append(ph2);
  vid.addEventListener('timeupdate', () => { ph.style.left = ph2.style.left = pct(Math.min(T, vid.currentTime)); });
  const axis = el('div', { class: 'axis' }, [0, 5, 10, 15, 20, 25, 30, 35, 40].map(s => el('span', { style: `left:${pct(s)}`, text: s + 's' })));
  tl.append(el('div', { class: 'rl', text: '参考动作' }), rowA, el('div', { class: 'rl', text: '生成段落与接缝（' + d.seams.map(fmt).join('、') + '）' }), rowW, axis);
  sec.append(tl);

  // reference videos
  sec.append(el('h4', { class: 'sub', text: '参考动作视频（真人）' }));
  sec.append(el('div', { class: 'refs' }, d.refs.map(r => el('div', { class: 'ref' }, [
    el('video', { src: 'refs/' + r.id + '.mp4', muted: '', loop: '', autoplay: '', playsinline: '', preload: 'metadata' }),
    el('div', { class: 'meta' }, [el('b', { text: r.id }), document.createTextNode(`${r.span[0]}–${r.span[1]} 秒 · ${r.caption}`)])]))));

  // actual inputs per window: montage (real people) | grey figure, same timeline
  if (d.inputs && d.inputs.length) {
    sec.append(el('h4', { class: 'sub', text: '每段实际喂给模型的动作参考（左：真人拼接参考，右：灰色小人，同一时间轴）' }));
    const iv = el('video', { class: 'inp', controls: '', preload: 'metadata', playsinline: '', muted: '' });
    const inote = el('p', { class: 'note' });
    const itabs = el('div', { class: 'tabs', role: 'tablist' });
    const show = x => { iv.src = x.file; inote.textContent = `${x.id}（${x.start}–${x.end} 秒）：真人参考 ${x.mon_frames} 帧，灰色小人 ${x.grey_frames} 帧，` +
      (Math.abs(x.mon_frames - x.grey_frames) > 3 ? '长度不一致' : '长度一致'); };
    d.inputs.forEach((x, i) => { const b_ = el('button', { role: 'tab', 'aria-selected': i ? 'false' : 'true', text: `${x.id} · ${x.start}–${x.end} 秒` });
      b_.onclick = () => { show(x); itabs.querySelectorAll('button').forEach(y => y.setAttribute('aria-selected', y === b_ ? 'true' : 'false')); };
      itabs.append(b_); });
    show(d.inputs[0]);
    sec.append(el('div', { class: 'inputs' }, [itabs, iv, inote]));
  }

  // seam close-ups
  sec.append(el('h4', { class: 'sub', text: '接缝处放大（每行一处接缝，从左到右是重叠里的 8 帧）' }));
  sec.append(el('div', { class: 'seams' + (m.single ? ' one' : '') }, [
    m.single ? null : el('figure', {}, [el('figcaption', { class: 'old', text: '原来：淡入淡出' }), el('div', { class: 'imgbox' }, [el('img', { src: 'img/' + key + '_seam_old.jpg', alt: m.name + ' 原来的接缝帧', loading: 'lazy' })])]),
    el('figure', {}, [el('figcaption', { class: 'new', text: m.single ? '光流对齐后混合' : '现在：光流对齐后混合' }), el('div', { class: 'imgbox' }, [el('img', { src: 'img/' + key + '_seam_new.jpg', alt: m.name + ' 现在的接缝帧', loading: 'lazy' })])])]));

  // story text
  sec.append(el('details', {}, [el('summary', { text: '故事原文（数据集里的 prompt）' }), el('div', { class: 'body' }, [el('pre', { class: 'txt', text: d.story })])]));

  // window prompts with tabs
  const pre = el('pre', { class: 'txt', text: d.prompts[0].text || '（没有）' });
  const tabs = el('div', { class: 'tabs', role: 'tablist' });
  d.prompts.forEach((p, i) => { const b_ = el('button', { role: 'tab', 'aria-selected': i ? 'false' : 'true', text: `${p.id} · ${p.start}–${p.end} 秒` });
    b_.onclick = () => { pre.textContent = p.text || '（没有）'; tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b_ ? 'true' : 'false')); };
    tabs.append(b_); });
  sec.append(el('details', {}, [el('summary', { text: '每段生成用的 prompt（最新一版）' }), el('div', { class: 'body' }, [tabs, pre])]));
  main.append(sec);
}
document.querySelectorAll('.ref video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
</script>
